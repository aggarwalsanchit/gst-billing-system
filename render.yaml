services:
  - type: web
    name: billing-system
    env: php
    buildCommand: |
      composer install
      cp .env.example .env
      php artisan key:generate
      php artisan migrate --force
      php artisan db:seed --force
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: billing-db
          property: connectionString

databases:
  - name: billing-db
    plan: free